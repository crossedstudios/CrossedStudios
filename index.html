<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossed Studios</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

</head>
<body>
    <header class="site-header">
        <div class="logo">
          <!-- Make the logo a clickable link -->
          <a href="index.html">
            <h1 class="crossed-title">Crossed Studios</h1>
          </a>
        </div>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="work.html">Work</a></li>
          </ul>
        </nav>
      </header>
      
    

    <main>
        <section class="hero">
            <video autoplay muted loop class="hero-video">
              <source src="media/11071.MP4" type="video/mp4">
              Your browser does not support the video tag.
            </video>
            <div class="hero-content">
              <h1>Welcome to Crossed Studios</h1>
           
            </div>
          </section>
          
        

        <section class="featured-work">
            <h3>Featured Work</h3>
            <div class="work-gallery">
                <img src="images/char char postersss.PNG" alt="Project 1">
                <img src="images/DSC00310.png" alt="Project 2">
                <img src="images/Screenshot 2025-05-01 at 3.30.54 AM.png" alt="Project 3">
            </div>
        </section>
    </main>

    <!-- Contact Me Section -->
<section class="contact">
    <h2>Contact Me</h2>
    <p>If you have any inquiries or want to collaborate, feel free to reach out!</p>

    <form action="https://formspree.io/f/xeogedzn" method="POST" class="contact-form">
        <div class="form-group">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label for="message">Your Message:</label>
            <textarea id="message" name="message" rows="4" placeholder="Enter your message" required></textarea>
        </div>
        <button type="submit" class="submit-btn">Send Message</button>
    </form>
</section>

<footer class="site-footer">
    <p>© 2025 Crossed Studios | All Rights Reserved</p>
    <div class="social-links">
        <footer>
            <div class="social-icons">
              <a href="https://www.tiktok.com/@crossed_studios" target="_blank">
                <i class="fab fa-tiktok"></i>
              </a>
              <a href="https://www.instagram.com/crossed_studios/" target="_blank">
                <i class="fab fa-instagram"></i>
              </a>
            </div>
          </footer>
          
  </footer>
  
</body>
</html>
